---
skill:
  intervalMinute: 5
  enableAgent: true
serviceAccount:
  name: khieron
  namespace: khieron-system
mcpConfig:
  mcpJson: {
    "mcpServers": {
      "rhoai": {
        "type": "http",
        "url": "http://rhoai-mcp:8000/mcp"
      }
    }
  }
extraFiles: {}
