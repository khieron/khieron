name: Lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint all Helm charts
        run: |
          exit_code=0
          for chart_file in $(find . -name Chart.yaml -not -path '*/vendor/*'); do
            chart_dir=$(dirname "$chart_file")
            echo "::group::Linting ${chart_dir}"
            if ! helm lint "${chart_dir}"; then
              exit_code=1
            fi
            echo "::endgroup::"
          done
          exit $exit_code
